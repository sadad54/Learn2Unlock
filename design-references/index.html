    *{box-sizing:border-box} body{margin:0;background:#e8edf2;color:#18283b;font-family:"Segoe UI",Arial,sans-serif}.gallery-head{max-width:1320px;margin:44px auto 20px;padding:0 24px}.gallery-head h1{margin:0;font-size:34px;letter-spacing:-.8px}.gallery-head p{color:#5b6878;max-width:750px;line-height:1.55}.gallery{max-width:1320px;margin:auto;padding:20px 24px 72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:44px 28px}.entry{display:flex;flex-direction:column;align-items:center}.entry-label{width:390px;margin-bottom:10px;font-size:13px;font-weight:700;color:#536274;text-transform:uppercase;letter-spacing:.8px}.phone{position:relative;width:390px;height:844px;border-radius:38px;overflow:hidden;box-shadow:0 20px 50px rgba(19,35,52,.18);background:#fff}.status{height:32px;padding:12px 20px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.2px}.status .sys{letter-spacing:2px}.screen-body{height:812px;overflow:hidden}.topbar{height:60px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px}.mark{width:30px;height:30px;border-radius:11px;background:var(--teal);display:grid;place-items:center;color:var(--navy);font-weight:900}.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid currentColor;display:grid;place-items:center;font-weight:800}.content{padding:8px 20px 98px}.title{font-size:25px;line-height:1.08;margin:8px 0 6px;letter-spacing:-.7px}.subtitle{font-size:13px;line-height:1.45;margin:0 0 18px}.card{border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.stack{display:flex;flex-direction:column;gap:10px}.label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}.small{font-size:12px}.tiny{font-size:10px}.big{font-size:28px;font-weight:800;letter-spacing:-1px}.btn der-radius:13px;display:grid;place-items:center;font-weight:900}.fab{position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:19px;display:grid;place-items:center;font-size:25px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.2)}.stepper{display:flex;gap:5px;margin:8px 20px 18px}.stepper i{height:5px;flex:1;border-radius:9px}.qr{width:184px;height:184px;margin:18px auto;background:repeating-linear-gradient(45deg,#10233a 0 8px,#fff 8px 16px),repeating-linear-gradient(-45deg,transparent 0 11px,#10233a 11px 17px);border:14px solid white;outline:1px solid #d8e1e9}.code{letter-spacing:7px;font-size:23px;font-weight:900;text-align:center}.timeline{border-left:2px solid;padding-left:16px;margin-left:7px}.dot{position:relative}.dot:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;left:-22px;top:5px}.donut{width:124px;height:124px;border-radius:50%;display:grid;place-items:center}.donut:before{content:"";width:84px;height:84px;border-radius:50%;background:inherit}.donuttext{position:absolute;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar span{height:28px;border-radius:8px;display:grid;place-items:center;font-size:10px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keypad b{height:48px;border-radius:14px;display:grid;place-items:center}.modal{position:absolute;inset:0;background:rgba(4,12,23,.68);display:flex;align-items:flex-end;padding:18px}.sheet{width:100%;border-radius:26px;padding:20px}.mascot{object-fit:contain}.answer{min-height:58px;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700}.answer i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.appTile{border-radius:19px;padding:13px 7px;text-align:center;font-size:10px;font-weight:700}.appTile .appicon{margin:0 auto 8px}.request{border-radius:18px;padding:14px}.chart{height:120px;display:flex;gap:9px;align-items:end;padding:8px 5px 0}.chart span{flex:1;border-radius:7px 7px 2px 2px;position:relative}.chart span:after{content:attr(data-day);position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:9px}.parent{background:var(--navy);color:var(--parentText)}.parent .status,.parent .subtitle,.parent .small,.parent .tiny{color:var(--parentMuted)}.parent .card{background:var(--navy2);border:1px solid rgba(255,255,255,.06)}.parent .field{background:#0f2035;border:1px solid #29415e}.parent .field .hint{color:#8599b1}.parent .btn{background:var(--teal);color:#092033}.parent .btn.secondary{background:transparent;color:#dce8f5;border-color:#536b84}.parent .divider{background:#29405b}.parent .chip{background:#203855;color:#b8c8d9}.parent .chip.on{background:var(--teal);color:#0b2631}.parent .nav{background:#102139;border-top:1px solid #263b55}.parent .navitem b{background:#1e3551}.parent .navitem.active{color:var(--teal)}.parent .navitem.active b{background:#21483f}.parent .progress{background:#263d58}.parent .ring{background:conic-gradient(var(--teal) 0 68%,#263b53 68%)}.parent .ring:before{background:var(--navy2)}.parent .track{background:#283d56}.parent .fill{background:var(--teal)}.parent .switch{background:var(--teal)}.parent .switch.off{background:#42536a}.parent .appicon{background:#223b59;color:#bcd0e4}.parent .fab{background:var(--teal);color:#0b2631}.parent .stepper i{background:#2c425c}.parent .stepper i.on{background:var(--teal)}.parent .calendar span{background:#1e3550}.parent .calendar span.on{background:var(--teal);color:#092033}.parent .chart span{background:linear-gradient(var(--teal),#248c82)}.parent .sheet{background:var(--navy2)}
    .child{background:var(--cream);color:var(--ink);font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif}.child .status{color:var(--ink)}.child .subtitle,.child .small,.child .tiny{color:#65758a}.child .card{background:var(--paper);border:1px solid #eadfcb;box-shadow:0 8px 20px rgba(71,52,22,.06)}.child .btn{background:var(--teal2);color:white;box-shadow:0 5px 0 #147565}.child .btn.secondary{background:white;color:var(--ink);border-color:#cfdad9;box-shadow:none}.child .field{background:#fff;border:1px solid #ded6c6}.child .divider{background:#eadfcb}.child .chip{background:#e9f5f1;color:#176c60}.child .nav{background:#fffdf8;border-top:1px solid #eadfcb}.child .progress{background:#e6ded1}.child .progress span{background:var(--gold)}.child .ring{background:conic-gradient(var(--teal2) 0 72%,#e7dfd1 72%)}.child .ring:before{background:var(--cream)}.child .appicon{background:#e8f3ef;color:#167466}.child .answer{background:white;border:2px solid #e4dccd}.child .answer i{background:#edf5f3;color:#207b70}.child .answer.selected{border-color:var(--teal2);background:#eaf8f4}.child .answer.selected i{background:var(--teal2);color:white}.child .keypad b{background:white;border:1px solid #dfd6c5}.child .appTile{background:white;border:1px solid #e8decb}.child .sheet{background:var(--cream)}
    body.single{background:transparent}.single .gallery-head,.single .entry-label{display:none}.single .gallery{display:block;margin:0;padding:0}.single .entry{display:none}.single .entry.show{display:block}.single .phone{border-radius:0;box-shadow:none}.single .phone:after{display:none}

<body>
  <header class="gallery-head"><h1>Learn2Unlock — UI reference set</h1><p>19 implementation-oriented mobile screens. Parent surfaces emphasize fast decisions and legible data; child surfaces make the reward path visible before every action.</p></header>
  <main class="gallery" id="gallery"></main>
  <script>
    (()=>{
    const icon=(letter,color='')=>`<div class="appicon" ${color?`style="background:${color}"`:''}>${letter}</div>`;
    const status=(dark=false)=>`<div class="status"><span>9:41</span><span class="sys">● ◔ ▰</span></div>`;
    const nav=(active)=>`<div class="nav">${[['H','Home'],['Q','Questions'],['R','Reports'],['S','Settings']].map(x=>`<div class="navitem ${active===x[1]?'active':''}"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div>`;
    const parentShell=(body,active='')=>`<div class="phone parent">${status(true)}<div class="screen-body">${body}${active?nav(active):''}</div></div>`;
    const childShell=body=>`<div class="phone child">${status()}<div class="screen-body">${body}</div></div>`;
    const top=(title,right='⋯')=>`<div class="topbar"><div class="brand"><span class="mark">L2</span>${title}</div><div class="iconbtn">${right}</div></div>`;
    const screens=[]; const add=(id,label,html)=>screens.push({id,label,html});

    add('p1','P1 · Splash / Auth gate',parentShell(`<div style="height:100%;display:grid;place-items:center;text-align:center;padding:40px"><div><div class="mark" style="width:78px;height:78px;border-radius:25px;margin:auto;font-size:22px">L2</div><h1 style="font-size:30px;margin:20px 0 7px">Learn2Unlock</h1><p class="subtitle">Learn a little. Unlock a little.</p><div class="progress" style="width:150px;margin:36px auto"><span style="width:63%;background:var(--teal)"></span></div><p class="tiny">Checking your family space…</p></div></div>`));
    add('p2','P2 · Register / Login',parentShell(`${top('Learn2Unlock','?')}<div class="content"><div class="label" style="color:var(--teal);margin-top:34px">Parent access</div><h1 class="title">Welcome back</h1><p class="subtitle">Sign in to manage learning goals and screen time.</p><div class="stack"><div class="field"><div class="hint">Email</div>parent@example.com</div><div class="field"><div class="hint">Password</div>••••••••••</div><div class="row between"><span class="small">Keep me signed in</span><b class="small" style="color:var(--teal)">Forgot password?</b></div><button class="btn">Sign in</button><button class="btn secondary">Create a parent account</button></div><div class="card" style="margin-top:28px"><div class="row gap"><b style="color:var(--gold)">i</b><div><b class="small">Your rules stay private</b><div class="tiny">Protected with your PIN or biometrics.</div></div></div></div></div>`));
    add('p3','P3 · Create child profile',parentShell(`${top('Add a child','×')}<div class="stepper"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div><div class="content"><div class="label" style="color:var(--teal)">Step 2 of 5 · School year</div><h1 class="title">What year is Aina in?</h1><p class="subtitle">We’ll match challenges to the right KSSR level.</p><div class="card"><div class="row gap"><div class="avatar">AI</div><div><b>Aina</b><div class="tiny">Nickname only · English</div></div></div></div><div class="chips" style="display:grid;grid-template-columns:repeat(2,1fr)">${[1,2,3,4,5,6].map(n=>`<div class="field ${n===4?'on':''}" style="text-align:center;${n===4?'border-color:var(--teal);color:var(--teal)':''}">Year ${n}</div>`).join('')}</div><div style="position:absolute;bottom:28px;left:20px;right:20px"><button class="btn" style="width:100%">Continue</button></div></div>`));
    add('p4','P4 · Device pairing',parentShell(`${top('Pair Aina’s device','×')}<div class="content" style="text-align:center"><div class="label" style="color:var(--teal)">Step 1 · Scan on child device</div><h1 class="title">Connect the devices</h1><p class="subtitle">Open Learn2Unlock Child and scan this code.</p><div class="qr"></div><div class="tiny">Or enter this 6-digit code</div><div class="code" style="margin:8px 0">482 715</div><div class="chip" style="margin:auto;background:#293d57">Expires in 04:32</div><div class="card" style="text-align:left;margin-top:24px"><div class="row gap"><span style="color:var(--teal);font-size:22px">◌</span><div><b class="small">Waiting for Aina’s device</b><div class="tiny">Keep this screen open while pairing.</div></div></div></div><button class="btn secondary" style="width:100%">Show setup help</button></div>`));
    add('p5','P5 · Controlled apps',parentShell(`${top('Choose apps','✓')}<div class="content"><div class="field" style="margin-bottom:12px">⌕&nbsp;&nbsp; Search installed apps</div><div class="chips"><span class="chip on">All</span><span class="chip">Games</span><span class="chip">Social</span><span class="chip">Video</span></div><div class="label" style="margin:18px 0 4px;color:var(--gold)">Always allowed</div><div class="card">${[['P','Phone'],['M','Message parent'],['S','School portal']].map(x=>`<div class="listitem">${icon(x[0])}<div style="flex:1"><b class="small">${x[1]}</b><div class="tiny">Essential app</div></div><span class="chip">Pinned</span></div>`).join('')}</div><div class="label" style="margin:16px 0 4px">Set limits</div><div class="card">${[['G','Galaxy Quest','Games',1],['Y','YouTube','Video',1],['C','ChatSpace','Social',0]].map(x=>`<div class="listitem">${icon(x[0])}<div style="flex:1"><b class="small">${x[1]}</b><div class="tiny">${x[2]}</div></div><div class="switch ${x[3]?'':'off'}"></div></div>`).join('')}</div></div>`));
    add('p6','P6 · Rule configuration',parentShell(`${top('Screen-time rules','✓')}<div class="content"><div class="card"><div class="row between"><div><div class="label">Daily limit</div><div class="big">60 <span class="small">min</span></div></div><div class="btnrow"><div class="iconbtn">−</div><div class="iconbtn">+</div></div></div><div class="progress" style="margin-top:12px"><span style="width:60%;background:var(--teal)"></span></div></div><div class="card"><div class="row between"><div><b class="small">Weekend schedule</b><div class="tiny">Use a separate daily limit</div></div><div class="switch"></div></div><div class="divider"></div><div class="row between"><span class="small">Saturday & Sunday</span><b>90 min</b></div></div><div class="card"><div class="label">Bedtime</div><div class="row between" style="margin-top:8px"><div class="big">8:30 <span class="small">PM</span></div><span class="chip">Change</span></div><div class="tiny" style="margin-top:8px">Rewards pause after bedtime.</div></div><div class="card"><div class="row between"><div><b class="small">5-minute warning</b><div class="tiny">Give Aina time to finish up.</div></div><div class="switch"></div></div></div><div class="card" style="border-color:#3b7b70"><div class="tiny">LIVE PREVIEW</div><b class="small">60 min/day · Bedtime at 8:30 PM</b></div></div>`));
    add('p7','P7 · Challenge & reward rules',parentShell(`${top('Challenge rules','✓')}<div class="content"><div class="card"><div class="row between"><span class="small">Questions per challenge</span><b>5</b></div><div class="divider"></div><div class="row between"><span class="small">Passing score</span><b style="color:var(--teal)">80%</b></div></div><div class="label" style="margin:16px 0 8px">Minutes earned per pass</div><div class="chips"><span class="chip">5 min</span><span class="chip on">10 min</span><span class="chip">15 min</span></div><div class="card" style="margin-top:14px;border-color:#826d32"><div class="row between"><div><div class="label" style="color:var(--gold)">Daily reward ceiling</div><div class="tiny">Hard cap protects the routine</div></div><div class="big">30 <span class="small">min</span></div></div><div class="progress" style="margin-top:11px"><span style="width:66%;background:var(--gold)"></span></div><div class="tiny" style="margin-top:7px">Current setup can earn up to 20 min/day.</div></div><div class="card"><div class="row between"><span class="small">Maximum attempts</span><b>2</b></div><div class="divider"></div><div class="row between"><div><span class="small">Parent approval</span><div class="tiny">Review before time is added</div></div><div class="switch off"></div></div></div><button class="btn" style="width:100%">Save reward rules</button></div>`));
    add('p8','P8 · Parent dashboard',parentShell(`${top('Good afternoon','2')}<div class="content"><div class="row between" style="margin-bottom:12px"><div class="row gap"><div class="avatar">AI</div><div><b>Aina</b><div class="tiny">Pixel 7a · Online now</div></div></div><span class="chip" style="color:#77e7d2">● Protected</span></div><div class="card"><div class="row between"><div class="ring" style="width:126px;height:126px"><div><span class="number">42</span><span class="tiny">min left</span></div></div><div style="width:176px"><div class="label">Today’s balance</div><div class="small" style="margin:8px 0">Used 18 of 60 min</div><div class="progress"><span style="width:30%;background:var(--teal)"></span></div><button class="btn secondary" style="width:100%;margin-top:15px;min-height:40px">Pause device</button></div></div></div><div class="request" style="background:#253651;border:1px solid #675e35"><div class="row between"><div><div class="label" style="color:var(--gold)">Time request</div><b class="small">10 min for Galaxy Quest</b></div><span class="tiny">2m</span></div><div class="btnrow" style="margin-top:12px"><button class="btn secondary" style="min-height:38px">Not now</button><button class="btn" style="min-height:38px">Approve</button></div></div><div class="card"><div class="row between"><b class="small">Learning pulse</b><span class="tiny">Last 7 days</span></div><div class="chartbars" style="margin-top:13px">${[['Math',74],['Science',61],['B. Melayu',86],['English',68]].map(x=>`<div class="barline"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><b>${x[1]}%</b></div>`).join('')}</div></div></div>`, 'Home'));
    add('p9','P9 · Question management',parentShell(`${top('Question bank','⌕')}<div class="content"><div class="chips"><span class="chip on">Verified</span><span class="chip">My questions</span><span class="chip">AI review · 3</span></div><div class="row between" style="margin:18px 0 6px"><span class="label">128 approved questions</span><span class="tiny">Filter</span></div>${[['Which fraction is equal to one half?','Mathematics · Fractions','Verified'],['Plants make food using…','Science · Life processes','Verified'],['Pilih kata adjektif yang betul.','Bahasa Melayu · Tatabahasa','Parent']].map((x,i)=>`<div class="card"><div class="row between"><span class="chip">${x[2]}</span><span>⋯</span></div><p class="small" style="color:white;line-height:1.4"><b>${x[0]}</b></p><div class="tiny">${x[1]} · Year ${i+3}</div></div>`).join('')}</div><div class="fab">+</div>`, 'Questions'));
    add('p10','P10 · AI question generation',parentShell(`${top('Generate with AI','×')}<div class="content"><div class="label" style="color:var(--teal)">Curriculum setup</div><div class="stack" style="margin-top:9px"><div class="btnrow"><div class="field" style="flex:1"><div class="hint">School year</div>Year 4</div><div class="field" style="flex:1"><div class="hint">Language</div>English</div></div><div class="field"><div class="hint">Subject</div>Science</div><div class="field"><div class="hint">Topic</div>Properties of materials</div><div class="field"><div class="hint">Learning standard</div>4.7.1 · Compare materials</div><div class="btnrow"><div class="field" style="flex:1"><div class="hint">Difficulty</div>Medium</div><div class="field" style="flex:1"><div class="hint">Questions</div>5</div></div><div class="field" style="height:78px"><div class="hint">Exclude or add instructions</div>No brand names or trick questions</div></div><div class="card" style="margin-top:14px;border-color:#715f2c"><div class="row gap"><b style="color:var(--gold)">◇</b><div><b class="small">Every question needs your review</b><div class="tiny">AI cannot change rules or award time.</div></div></div></div><button class="btn" style="width:100%">Generate 5 questions</button></div>`));
    add('p11','P11 · Reports',parentShell(`${top('Reports','⇩')}<div class="content"><div class="row between"><div class="chips"><span class="chip on">Screen time</span><span class="chip">Learning</span></div><span class="chip">7 days</span></div><div class="card" style="margin-top:14px"><div class="tiny">TOTAL USED</div><div class="big">4h 12m</div><div class="chart">${[['M',48],['T',70],['W',45],['T',85],['F',64],['S',96],['S',72]].map(x=>`<span data-day="${x[0]}" style="height:${x[1]}%"></span>`).join('')}</div></div><div class="card"><div class="row between"><b class="small">Time earned vs used</b><span class="tiny">minutes</span></div><div class="row gap" style="margin-top:16px"><div class="donut" style="background:conic-gradient(var(--teal) 0 67%,var(--gold) 67%);position:relative"><div class="donuttext"><b>120</b><div class="tiny">earned</div></div></div><div style="flex:1"><div class="listitem"><span style="color:var(--teal)">●</span><div class="small">Used rewards</div><b style="margin-left:auto">80</b></div><div class="listitem"><span style="color:var(--gold)">●</span><div class="small">Saved</div><b style="margin-left:auto">40</b></div></div></div></div><div class="card"><div class="row between"><b class="small">Most used apps</b><span class="tiny">View all</span></div>${[['Y','YouTube','1h 24m'],['G','Galaxy Quest','52m']].map(x=>`<div class="listitem">${icon(x[0])}<span class="small" style="flex:1">${x[1]}</span><b class="small">${x[2]}</b></div>`).join('')}</div></div>`, 'Reports'));
    add('p12','P12 · Additional-time requests',parentShell(`${top('Time requests','⌕')}<div class="content"><div class="row between"><h1 class="title" style="font-size:20px">Needs your decision</h1><span class="chip" style="color:var(--gold)">2 pending</span></div>${[['Aina','Galaxy Quest','10 min','2 min ago'],['Irfan','YouTube Kids','15 min','18 min ago']].map((x,i)=>`<div class="card"><div class="row gap"><div class="avatar">${x[0].slice(0,2).toUpperCase()}</div><div style="flex:1"><b>${x[0]}</b><div class="tiny">${x[3]}</div></div><span class="chip">Pending</span></div><div class="divider"></div><div class="row between"><div><div class="tiny">REQUESTED APP</div><b class="small">${x[1]}</b></div><div style="text-align:right"><div class="tiny">EXTRA TIME</div><b>${x[2]}</b></div></div><div class="btnrow" style="margin-top:14px"><button class="btn secondary">Decline</button><button class="btn secondary">Modify</button><button class="btn">Approve</button></div></div>`).join('')}<div class="label" style="margin:20px 0 8px">Earlier today</div><div class="card"><div class="row gap"><span style="color:var(--teal)">✓</span><div><b class="small">5 min approved for Aina</b><div class="tiny">Math challenge reward · 10:42 AM</div></div></div></div></div>`));
    add('p13','P13 · Settings',parentShell(`${top('Settings','')}<div class="content"><div class="row gap" style="margin-bottom:20px"><div class="avatar">PA</div><div><b>Parent account</b><div class="tiny">parent@example.com</div></div></div>${[['Security',[['PIN lock','On'],['Biometric unlock','On']]],['Preferences',[['Notifications','Requests + alerts'],['Language','English']]],['Your data',[['Export family data',''],['Delete my data','']]],['About',[['Privacy policy',''],['Plan','Free pilot']]]].map(sec=>`<div class="label" style="margin:16px 0 6px">${sec[0]}</div><div class="card">${sec[1].map((x,i)=>`<div class="listitem" style="${i?'border-top:1px solid #29405b':''}"><span class="small" style="flex:1;${x[0].includes('Delete')?'color:#ff9c8e':''}">${x[0]}</span><span class="tiny">${x[1]} &nbsp;›</span></div>`).join('')}</div>`).join('')}<button class="btn secondary" style="width:100%;margin-top:12px">Sign out</button></div>`, 'Settings'));

    add('c1','C1 · Child home',childShell(`${top('Hi, Aina!','☎')}<div class="content" style="text-align:center"><p class="subtitle" style="margin-bottom:8px">You’ve got play time ready</p><div class="ring" style="width:184px;height:184px;margin:8px auto 16px"><div><span class="number" style="font-size:44px">42</span><b>minutes left</b></div></div><button class="btn" style="width:100%;font-size:17px">Earn more time</button><div class="card" style="text-align:left;margin-top:16px"><div class="row between"><b class="small">Today’s learning path</b><b style="color:var(--teal2)">60%</b></div><div class="progress" style="margin:10px 0"><span style="width:60%"></span></div><div class="tiny">3 of 5 questions completed</div></div><div class="row between" style="margin:18px 0 10px"><b>My apps</b><button class="btn secondary" style="min-height:38px">Ask parent</button></div><div class="apps">${[['M','Math Lab'],['S','School'],['V','Videos'],['G','Galaxy','locked'],['C','Chat','locked'],['A','Art Pad']].map(x=>`<div class="appTile" style="${x[2]?'opacity:.48':''}">${icon(x[0])}${x[1]}${x[2]?'<div class="tiny">Locked</div>':''}</div>`).join('')}</div></div>`));
    add('c2','C2 · Restriction screen',childShell(`${top('Play time','☎')}<div class="content" style="text-align:center"><img src="assets/milo-mascot.png" class="mascot" style="width:148px;height:148px"><h1 class="title">Play time is paused</h1><p class="subtitle">You used today’s game time. You can earn more with a quick challenge.</p><div class="card" style="text-align:left"><div class="label" style="color:var(--teal2)">Your challenge</div><div class="listitem"><b class="big">5</b><span class="small">questions</span><b class="big" style="margin-left:auto">80%</b><span class="small">to pass</span></div><div class="divider"></div><div class="row between"><span class="small">Reward</span><b style="color:var(--teal2)">+10 minutes</b></div></div><div class="card"><div class="tiny">NEXT FREE PLAY TIME</div><div class="big" style="font-size:23px">Tomorrow · 7:00 AM</div></div><button class="btn" style="width:100%;font-size:17px">Start challenge</button><button class="btn secondary" style="width:100%;margin-top:12px">Back to allowed apps</button></div>`));
    add('c3','C3 · Challenge',childShell(`${top('Science challenge','×')}<div class="content"><div class="row between"><span class="chip">Question 2 of 5</span><span class="chip">+10 min</span></div><div class="progress" style="margin:13px 0 28px"><span style="width:40%;background:var(--teal2)"></span></div><div class="label" style="color:var(--teal2)">Properties of materials</div><h1 class="title" style="font-size:27px;line-height:1.25;margin-bottom:22px">Which material is best for a raincoat?</h1><div class="stack"><div class="answer"><i>A</i>Cotton</div><div class="answer selected"><i>B</i>Waterproof plastic</div><div class="answer"><i>C</i>Paper</div><div class="answer"><i>D</i>Wool</div></div><div class="card" style="margin-top:20px;background:#eef8f5"><div class="row gap"><b style="color:var(--teal2)">◇</b><span class="small">Choose one answer. You can change it before continuing.</span></div></div><button class="btn" style="position:absolute;bottom:28px;left:20px;right:20px;font-size:17px">Next question</button></div>`));
    add('c4','C4 · Result screen',childShell(`${top('Challenge complete','×')}<div class="content" style="text-align:center"><div style="position:relative;height:190px"><span style="position:absolute;left:32px;top:25px;color:var(--gold);font-size:28px">✦</span><span style="position:absolute;right:42px;top:45px;color:var(--coral);font-size:22px">✦</span><img src="assets/milo-mascot.png" class="mascot" style="width:165px;height:165px"></div><div class="chip" style="background:#dff5ee;font-size:13px">Challenge passed</div><h1 class="title" style="font-size:31px">Great thinking, Aina!</h1><p class="subtitle">You answered 4 of 5 correctly.</p><div class="card"><div class="row between"><div style="text-align:left"><div class="tiny">TIME UNLOCKED</div><div class="big" style="color:var(--teal2)">+10 min</div></div><div class="ring" style="width:82px;height:82px"><div><b>80%</b></div></div></div></div><div class="card" style="text-align:left"><div class="row between"><b class="small">Review one answer</b><span class="tiny">Flag</span></div><p class="small"><b>Paper is not waterproof.</b></p><div class="tiny">Waterproof plastic keeps rain from passing through.</div></div><button class="btn" style="width:100%;font-size:17px">Use my play time</button></div>`));
    add('c5','C5 · Ask parent',childShell(`${top('Ask parent','×')}<div class="content"><h1 class="title">What do you need?</h1><p class="subtitle">Pick one message. Your parent will see it on their phone.</p><div class="stack"><div class="answer selected"><i>1</i><div><b>I’d like more time</b><div class="tiny">Ask for 10 extra minutes</div></div></div><div class="answer"><i>2</i><div><b>I need help</b><div class="tiny">Something in the app is confusing</div></div></div><div class="answer"><i>3</i><div><b>My challenge seems wrong</b><div class="tiny">Ask a parent to review a question</div></div></div></div><div class="card" style="margin-top:20px"><div class="row between"><span class="small">App</span><b class="small">Galaxy Quest</b></div><div class="divider"></div><div class="row between"><span class="small">Extra time</span><b class="small">10 minutes</b></div></div><button class="btn" style="width:100%;font-size:17px">Send to parent</button><div class="timeline" style="margin-top:24px"><div class="dot" style="margin-bottom:20px"><b class="small">Request ready</b><div class="tiny">Not sent yet</div></div><div class="dot" style="opacity:.45"><b class="small">Parent decision</b></div></div></div>`));
    add('c6','C6 · Emergency apps',childShell(`${top('Always available','×')}<div class="content"><div class="card" style="background:#eaf8f4;border-color:#c5e5dc"><div class="row gap"><b style="font-size:24px;color:var(--teal2)">✓</b><div><b>You can always use these apps</b><div class="tiny">They never use your play-time balance.</div></div></div></div><h1 class="title" style="font-size:23px;margin-top:24px">Call, message, or learn</h1><div class="apps" style="grid-template-columns:repeat(2,1fr);margin-top:16px">${[['P','Phone','Call trusted contacts'],['M','Message parent','Send a family message'],['S','School portal','Open your class tools'],['E','Emergency','Call emergency services']].map((x,i)=>`<div class="appTile" style="padding:20px 10px;${i===3?'border-color:#e5a49d;background:#fff3f0':''}">${icon(x[0],i===3?'#f9d8d3':'')}<b style="font-size:13px">${x[1]}</b><div class="tiny" style="margin-top:5px">${x[2]}</div></div>`).join('')}</div><div class="card" style="margin-top:24px"><div class="label" style="color:var(--teal2)">Safety note</div><p class="small" style="line-height:1.5;margin-bottom:0">Emergency calls are always available, even when play time is paused.</p></div><button class="btn secondary" style="width:100%;margin-top:12px">Back to my apps</button></div>`));

    const gallery=document.getElementById('gallery');
    gallery.innerHTML=screens.map(s=>`<section class="entry" data-id="${s.id}"><div class="entry-label">${s.label}</div>${s.html}</section>`).join('');
    const selected=new URLSearchParams(location.search).get('screen');
    if(selected){document.body.classList.add('single');document.querySelector(`[data-id="${selected}"]`)?.classList.add('show')}
    })();
  </script>
</body>
</html>
